<div id="comments-page" class="page p-0 relative min-h-screen bg-slate-900">
    <!-- Background Ambient Glow -->
    <div class="absolute top-[10%] left-[-10%] w-[300px] h-[300px] bg-indigo-600/10 rounded-full blur-[100px] pointer-events-none z-0"></div>

    <!-- Sticky Header -->
    <div class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-xl px-5 py-4 flex items-center border-b border-slate-700/50 shadow-lg">
        <button onclick="goBack()" class="mr-4 w-10 h-10 rounded-full bg-slate-800 border border-slate-600 flex items-center justify-center text-gray-300 hover:text-white hover:bg-slate-700 hover:border-indigo-500 transition-all shadow-sm group">
            <i class="fas fa-arrow-left text-sm group-hover:-translate-x-1 transition-transform"></i>
        </button>
        <h2 class="text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-blue-400 tracking-wide flex items-center gap-2">
            <i class="fas fa-comment-dots text-indigo-400"></i> Discussions
        </h2>
    </div>

    <div class="p-5 relative z-10 max-w-3xl mx-auto">
        <!-- Premium Input Area -->
        <div class="bg-slate-800/60 backdrop-blur-md p-4 rounded-3xl border border-slate-700/50 shadow-lg mb-8 relative group focus-within:border-indigo-500/50 focus-within:shadow-[0_0_20px_rgba(79,70,229,0.15)] transition-all">
            <div class="flex gap-3 items-center">
                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center font-bold text-white shadow-md border border-white/10 flex-shrink-0" id="current-user-avatar">
                    U
                </div>
                <input type="text" id="comment-input" maxlength="50" class="flex-1 bg-transparent text-white placeholder-gray-500 focus:outline-none text-sm font-medium" placeholder="Share your thoughts (max 50 chars)..." autocomplete="off">
                <button onclick="submitComment()" class="w-10 h-10 rounded-full bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 flex items-center justify-center text-white transition-all transform hover:scale-105 active:scale-95 shadow-[0_4px_10px_rgba(79,70,229,0.4)] flex-shrink-0">
                    <i class="fas fa-paper-plane ml-[-2px]"></i>
                </button>
            </div>
            <div class="absolute bottom-2.5 right-16 text-[10px] text-gray-400 font-bold bg-slate-900/60 px-2 py-0.5 rounded-md border border-slate-700"><span id="comment-char-count">0</span> / 50</div>
        </div>

        <div id="comments-list" class="space-y-4 pb-24"></div>
    </div>
</div>
