<div id="watch-page" class="page hidden">
    <!-- Background ambient glow -->
    <div class="absolute top-[10%] left-[20%] w-[300px] h-[300px] bg-indigo-600/10 rounded-full blur-[120px] pointer-events-none z-0"></div>

    <div class="ad-spacer"></div>
    <div class="max-w-4xl mx-auto p-4 relative z-10">
        <button onclick="closePlayer()" class="mb-4 bg-slate-800/80 backdrop-blur-md hover:bg-slate-700 border border-slate-700 px-4 py-2 rounded-xl flex items-center text-gray-300 transition-all shadow-md group">
            <i class="fas fa-arrow-left mr-2 group-hover:-translate-x-1 transition-transform"></i> Back to Details
        </button>

        <h2 id="player-movie-title" class="text-xl sm:text-2xl font-extrabold mb-4 text-white drop-shadow-md">Movie Title</h2>

        <div class="player-wrapper">
            <div class="video-screen">
                <div class="video-loader" id="videoLoader">
                    <div class="spinner"></div>
                </div>
                <div class="security-mask" onclick="togglePlay()"></div>
                <video id="directVideo" style="display:none;"></video>
                <div id="embedContainer"></div>
            </div>

            <div class="controls">
                <!-- Premium Slider with Tooltip -->
                <div class="progress-row">
                    <span class="time-txt" id="currTime">00:00</span>
                    <div class="slider-container" id="sliderContainer">
                        <div class="seek-tooltip" id="seekTooltip">00:00</div>
                        <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
                        <input type="range" id="seekSlider" value="0" min="0" step="1" oninput="handleSeekInput()" onchange="seekVideo()">
                    </div>
                    <span class="time-txt right" id="totalTime">00:00</span>
                </div>

                <div class="buttons-row">
                    <button class="vol-btn" onclick="toggleMute()"><i class="fas fa-volume-up" id="volIcon"></i></button>

                    <div class="center-controls">
                        <!-- Episode Prev -->
                        <button class="ep-nav-btn" id="prevEpBtn" onclick="playPrevEp()" style="display: none;" title="Previous Episode"><i class="fas fa-step-backward"></i></button>

                        <button class="skip-btn" onclick="skip(-10)"> <i class="fas fa-rotate-left"></i><span>10</span> </button>
                        <button class="play-btn mx-2" id="playBtn" onclick="togglePlay()"> <i class="fas fa-play"></i> </button>
                        <button class="skip-btn" onclick="skip(10)"> <i class="fas fa-rotate-right"></i><span>10</span> </button>

                        <!-- Episode Next -->
                        <button class="ep-nav-btn" id="nextEpBtn" onclick="playNextEp()" style="display: none;" title="Next Episode"><i class="fas fa-step-forward"></i></button>
                    </div>

                    <div style="width: 24px;"></div> <!-- Spacer -->
                </div>
            </div>
        </div>

        <!-- AD LOCATION 3 -->
        <div class="ad-container mt-4 mb-2">
             <iframe srcdoc="<script>
                  atOptions = {
                    'key' : 'aa465b71c480195a3ddce17207d3b9d7',
                    'format' : 'iframe',
                    'height' : 50,
                    'width' : 320,
                    'params' : {}
                  };
                </script>
                <script src='https://www.highperformanceformat.com/aa465b71c480195a3ddce17207d3b9d7/invoke.js'></script>"
                width="320" height="50" scrolling="no" frameborder="0" style="border:none; overflow:hidden;"></iframe>
        </div>

        <div class="server-box">
            <span class="server-label"><i class="fas fa-broadcast-tower mr-1 text-indigo-400"></i> Video Servers</span>
            <div class="btn-list" id="server-buttons-container"></div>
        </div>
    </div>
</div>
