<div id="banners" class="admin-page fade-in">
    <div class="flex items-center gap-3 mb-6">
        <div class="w-10 h-10 rounded-full bg-teal-600/20 flex items-center justify-center border border-teal-500/30 shadow-lg">
            <i class="fas fa-images text-teal-400 text-lg"></i>
        </div>
        <h2 class="text-2xl sm:text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-emerald-400 tracking-wide">Banner Management</h2>
    </div>

    <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 mb-8 shadow-2xl relative overflow-hidden">
        <!-- Background Glow -->
        <div class="absolute top-[-50%] right-[-10%] w-64 h-64 bg-teal-600/10 rounded-full blur-[80px] pointer-events-none"></div>

        <form id="banner-form" class="flex flex-col gap-5 relative z-10">

            <!-- Step 1: Link Content -->
            <div class="bg-gray-900/50 p-5 rounded-xl border border-gray-700 shadow-inner">
                <label class="text-xs font-bold text-teal-400 mb-3 block uppercase tracking-widest"><i class="fas fa-search mr-2"></i>Step 1: Search & Link Content</label>
                <div class="relative">
                    <i class="fas fa-film absolute left-4 top-4 text-gray-500"></i>
                    <input type="text" id="banner-movie-search" placeholder="Search by Movie/Series title..." class="w-full bg-gray-800 text-white pl-11 pr-4 py-3.5 rounded-xl border border-gray-600 focus:border-teal-500 focus:ring-1 focus:ring-teal-500 outline-none transition-all placeholder-gray-500">
                    <div id="banner-search-results" class="absolute w-full bg-gray-800 border border-teal-500/50 mt-2 rounded-xl z-50 max-h-56 overflow-y-auto hidden shadow-[0_10px_30px_rgba(0,0,0,0.5)] custom-scrollbar"></div>
                </div>

                <!-- Selection Preview -->
                <input type="hidden" id="banner-selected-movie-id">
                <div id="banner-selection-preview" class="hidden mt-3 bg-gradient-to-r from-teal-900/40 to-emerald-900/20 p-3 rounded-lg border border-teal-500/30 flex items-center transition-all">
                    <div class="flex items-center gap-2 text-sm text-teal-100">
                        <i class="fas fa-check-circle text-teal-400"></i>
                        <span>Linked Content: <span id="banner-selected-title" class="font-bold text-white tracking-wide ml-1"></span></span>
                    </div>
                </div>
            </div>

            <!-- Step 2: Banner Image -->
            <div class="bg-gray-900/50 p-5 rounded-xl border border-gray-700 shadow-inner">
                <label class="text-xs font-bold text-emerald-400 mb-3 block uppercase tracking-widest"><i class="fas fa-image mr-2"></i>Step 2: Banner Image URL</label>
                <div class="relative">
                    <i class="fas fa-link absolute left-4 top-4 text-gray-500"></i>
                    <input id="banner-url" type="text" placeholder="https://... (Any ratio: Poster or Landscape)" class="w-full bg-gray-800 text-white pl-11 pr-4 py-3.5 rounded-xl border border-gray-600 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none transition-all placeholder-gray-500" required>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="bg-gradient-to-r from-teal-500 to-emerald-600 hover:from-teal-400 hover:to-emerald-500 w-full py-4 rounded-xl font-bold text-white shadow-[0_0_20px_rgba(20,184,166,0.3)] transition-all transform hover:-translate-y-0.5 active:scale-95 text-lg">
                <i class="fas fa-cloud-upload-alt mr-2"></i> Publish Banner
            </button>
        </form>
    </div>

    <div class="flex items-center gap-2 mb-5 border-b border-gray-700/50 pb-3">
        <h3 class="text-sm font-bold text-gray-200 uppercase tracking-widest"><i class="fas fa-layer-group text-teal-400 mr-2"></i>Active Banners Grid</h3>
    </div>
    <!-- ID changed to target via JS, padding added for hover effects -->
    <div id="banners-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-6"></div>
</div>
