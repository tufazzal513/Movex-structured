<div id="all-movies" class="admin-page fade-in">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold">Content List</h2>
        <span class="bg-blue-600 text-white text-xs px-2 py-1 rounded-full" id="total-movies-badge">0</span>
    </div>

    <!-- Filter Bar -->
    <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 mb-4 shadow-lg">
        <div class="flex flex-wrap gap-4 items-center">

            <div class="filter-group">
                <span class="filter-label"><i class="fas fa-layer-group text-blue-400 mr-1"></i>Type</span>
                <button data-type-filter="all" class="filter-btn active" onclick="filterMovies('type', 'all')">All</button>
                <button data-type-filter="movie" class="filter-btn inactive" onclick="filterMovies('type', 'movie')"><i class="fas fa-film text-[10px]"></i> Movies</button>
                <button data-type-filter="series" class="filter-btn inactive" onclick="filterMovies('type', 'series')"><i class="fas fa-tv text-[10px]"></i> Series</button>
            </div>

            <div class="filter-group">
                <span class="filter-label"><i class="fas fa-globe text-emerald-400 mr-1"></i>Status</span>
                <button data-status-filter="all" class="filter-btn active" onclick="filterMovies('status', 'all')">All</button>
                <button data-status-filter="public" class="filter-btn inactive" onclick="filterMovies('status', 'public')"><i class="fas fa-eye text-[10px]"></i> Public</button>
                <button data-status-filter="private" class="filter-btn inactive" onclick="filterMovies('status', 'private')"><i class="fas fa-eye-slash text-[10px]"></i> Private</button>
            </div>

            <div class="filter-group">
                <span class="filter-label"><i class="fas fa-clock text-amber-400 mr-1"></i>Upcoming</span>
                <button data-upcoming-filter="all" class="filter-btn active" onclick="filterMovies('upcoming', 'all')">All</button>
                <button data-upcoming-filter="yes" class="filter-btn inactive" onclick="filterMovies('upcoming', 'yes')"><i class="fas fa-check text-[10px]"></i> Yes</button>
                <button data-upcoming-filter="no" class="filter-btn inactive" onclick="filterMovies('upcoming', 'no')"><i class="fas fa-times text-[10px]"></i> No</button>
            </div>

            <div class="flex-1"></div>

            <div class="flex gap-2">
                <select id="category-filter" class="bg-gray-700 text-white text-xs font-semibold px-4 py-2 rounded-full border border-gray-600 focus:border-blue-500 outline-none shadow-sm cursor-pointer hover:bg-gray-600 transition-colors" onchange="filterMovies('category', this.value)">
                    <option value="all">All Categories</option>
                </select>

                <select id="year-filter" class="bg-gray-700 text-white text-xs font-semibold px-4 py-2 rounded-full border border-gray-600 focus:border-blue-500 outline-none shadow-sm cursor-pointer hover:bg-gray-600 transition-colors" onchange="filterMovies('year', this.value)">
                    <option value="all">All Years</option>
                </select>
            </div>
        </div>
    </div>

    <div class="sticky top-0 z-30 bg-gray-900 pb-4">
        <div class="relative">
            <input type="text" id="admin-search-input" placeholder="Search by title..." class="w-full bg-gray-800 text-white pl-10 pr-4 py-3 rounded-lg border border-gray-700 focus:border-blue-500 outline-none shadow-md">
            <i class="fas fa-search absolute left-3 top-3.5 text-gray-500"></i>
        </div>
    </div>
    <div class="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden shadow-lg">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead class="bg-gray-700/50 text-gray-300 text-xs uppercase">
                    <tr>
                        <th class="p-4 whitespace-nowrap">Poster</th>
                        <th class="p-4 whitespace-nowrap">Title</th>
                        <th class="p-4 whitespace-nowrap">Type</th>
                        <th class="p-4 whitespace-nowrap">Status</th>
                        <th class="p-4 whitespace-nowrap">Category</th>
                        <th class="p-4 whitespace-nowrap">Year</th>
                        <th class="p-4 whitespace-nowrap text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="all-movies-table" class="text-sm divide-y divide-gray-700"></tbody>
            </table>
        </div>
    </div>
</div>
