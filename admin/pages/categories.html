<div id="categories" class="admin-page fade-in">
    <div class="flex items-center gap-3 mb-6">
        <div class="w-10 h-10 rounded-full bg-cyan-600/20 flex items-center justify-center border border-cyan-500/30 shadow-lg">
            <i class="fas fa-th-large text-cyan-400 text-lg"></i>
        </div>
        <h2 class="text-2xl sm:text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 tracking-wide">Category Manager</h2>
    </div>

    <!-- Add Category Form -->
    <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 mb-8 shadow-2xl relative overflow-hidden">
        <div class="absolute top-[-50%] right-[-10%] w-64 h-64 bg-cyan-600/10 rounded-full blur-[80px] pointer-events-none"></div>

        <h3 class="text-sm font-bold text-cyan-400 mb-4 uppercase tracking-widest flex items-center"><i class="fas fa-plus-circle mr-2"></i>Create New Category</h3>

        <form id="category-form" class="flex flex-col sm:flex-row gap-4 relative z-10">
            <input type="hidden" id="category-edit-id">
            <div class="flex-1 relative">
                <i class="fas fa-tag absolute left-4 top-4 text-gray-500"></i>
                <input id="category-name" type="text" placeholder="e.g. Action, Bollywood, Web Series..." class="w-full bg-gray-900/60 text-white pl-11 pr-4 py-3.5 rounded-xl border border-gray-600 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none transition-all placeholder-gray-500 shadow-inner" required>
            </div>
            <button type="submit" class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 px-8 py-3.5 rounded-xl font-bold text-white shadow-[0_0_15px_rgba(6,182,212,0.3)] transition-all transform hover:-translate-y-0.5 active:scale-95 whitespace-nowrap">
                <i class="fas fa-plus mr-2"></i> Add Category
            </button>
        </form>
    </div>

    <!-- Active Categories List -->
    <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-2xl relative overflow-hidden">
        <div class="flex justify-between items-center mb-5 border-b border-gray-700/50 pb-3">
            <h3 class="text-sm font-bold text-gray-200 uppercase tracking-widest flex items-center"><i class="fas fa-list-ul text-blue-400 mr-2"></i>Active Categories</h3>
        </div>
        <!-- Grid columns updated for better responsive look -->
        <ul id="categories-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 relative z-10"></ul>
    </div>
</div>
