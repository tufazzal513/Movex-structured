<div id="users" class="admin-page fade-in">

    <div class="flex items-center gap-3 mb-6">
        <div class="w-10 h-10 rounded-full bg-rose-600/20 flex items-center justify-center border border-rose-500/30 shadow-lg">
            <i class="fas fa-users-cog text-rose-400 text-lg"></i>
        </div>
        <h2 class="text-2xl sm:text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-rose-500 tracking-wide">User Management</h2>
    </div>

    <!-- Premium Tool Bar (Filter & Search) -->
    <div class="bg-gray-800 p-5 rounded-2xl border border-gray-700 mb-6 shadow-2xl relative overflow-hidden">
        <div class="absolute top-[-50%] left-[-10%] w-64 h-64 bg-rose-600/5 rounded-full blur-[80px] pointer-events-none"></div>

        <div class="flex flex-col md:flex-row gap-4 relative z-10">
            <!-- Search Bar -->
            <div class="relative flex-1">
                <i class="fas fa-search absolute left-4 top-3.5 text-gray-500"></i>
                <input type="text" id="user-search-input" placeholder="Search by name, email or UID..." class="w-full bg-gray-900/80 text-white pl-11 pr-4 py-3 rounded-xl border border-gray-600 focus:border-rose-500 focus:ring-1 focus:ring-rose-500 outline-none transition-all shadow-inner">
            </div>

            <!-- Filter Buttons -->
            <div class="flex flex-wrap items-center gap-2 bg-gray-900/50 px-3 py-2 rounded-xl border border-gray-700/50 shadow-inner">
                <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest"><i class="fas fa-filter mr-1 text-rose-400"></i>Filter</span>
                <div class="w-px h-6 bg-gray-700 mx-1 hidden sm:block"></div>
                <button data-user-filter="all" class="filter-btn active" onclick="filterUsers('status', 'all')">All</button>
                <button data-user-filter="live" class="filter-btn inactive" onclick="filterUsers('status', 'live')"><i class="fas fa-satellite-dish text-[10px] text-green-400"></i> Live</button>
                <button data-user-filter="active" class="filter-btn inactive" onclick="filterUsers('status', 'active')">Active</button>
                <button data-user-filter="frozen" class="filter-btn inactive" onclick="filterUsers('status', 'frozen')"><i class="fas fa-snowflake text-[10px] text-blue-300"></i> Frozen</button>
                <button data-user-filter="new" class="filter-btn inactive" onclick="filterUsers('status', 'new')">New (7d)</button>
            </div>
        </div>
    </div>

    <!-- Users Table (Premium Responsive Design) -->
    <div class="bg-gray-800 rounded-2xl border border-gray-700 overflow-hidden shadow-2xl mb-6">
        <div class="overflow-x-auto custom-scrollbar">
            <table class="w-full min-w-[800px] text-left border-collapse">
                <thead class="bg-gray-900/80 text-gray-400 text-[10px] font-bold uppercase tracking-widest border-b border-gray-700">
                    <tr>
                        <th class="p-5 whitespace-nowrap w-16">Profile</th>
                        <th class="p-5 whitespace-nowrap">Name & Email</th>
                        <th class="p-5 whitespace-nowrap">User UID</th>
                        <th class="p-5 whitespace-nowrap">Current Status</th>
                        <th class="p-5 whitespace-nowrap">Join Date</th>
                        <th class="p-5 whitespace-nowrap text-right">Action</th>
                    </tr>
                </thead>
                <tbody id="users-table-body" class="text-sm divide-y divide-gray-700/50"></tbody>
            </table>
        </div>
    </div>

    <!-- NEW COMPACT & PREMIUM USER EDIT POPUP -->
    <div id="user-edit-panel" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-md p-4 fade-in">
        <!-- Reduced max-width and removed huge height, added elegant styling -->
        <div class="relative overflow-hidden shadow-[0_0_40px_rgba(0,0,0,0.5)] border border-gray-700 bg-gray-900 rounded-3xl w-full max-w-2xl transform transition-all scale-100">

            <!-- Cinematic Banner Background -->
            <div class="h-28 w-full bg-gradient-to-r from-orange-600 via-rose-600 to-purple-800 relative">
                <div class="absolute inset-0 bg-black/20"></div>
                <div class="absolute bottom-0 left-0 w-full h-1/2 bg-gradient-to-t from-gray-900 to-transparent"></div>

                <!-- Premium Close Button -->
                <button id="user-close-panel" class="absolute top-4 right-4 text-white/70 hover:text-white bg-black/30 hover:bg-red-500 w-8 h-8 rounded-full z-20 transition-all flex items-center justify-center backdrop-blur-md border border-white/10 hover:border-red-500">
                    <i class="fas fa-times text-sm"></i>
                </button>
            </div>

            <div class="px-6 pb-7 relative">
                <!-- Floating Profile Section (Overlaps the Banner to save vertical space) -->
                <div class="flex flex-col sm:flex-row items-center sm:items-end justify-between -mt-12 mb-6 gap-4 border-b border-gray-800 pb-5">
                    <div class="flex flex-col sm:flex-row items-center gap-4 text-center sm:text-left z-10 w-full sm:w-auto">
                        <div id="user-detail-avatar" class="w-24 h-24 rounded-full border-4 border-gray-900 shadow-xl bg-gradient-to-tr from-orange-500 to-rose-400 flex items-center justify-center text-4xl font-bold text-white uppercase flex-shrink-0">U</div>
                        <div class="mt-2 sm:mt-8">
                            <h3 id="user-detail-name" class="text-xl font-bold text-white leading-tight truncate max-w-[200px] sm:max-w-xs">Name</h3>
                            <p id="user-detail-email" class="text-xs text-gray-400 mt-0.5 truncate max-w-[200px] sm:max-w-xs">email</p>
                        </div>
                    </div>
                    <div id="user-detail-status-badge" class="flex-shrink-0 z-10 sm:mb-2"></div>
                </div>

                <!-- Compact Info Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                    <!-- UID Box -->
                    <div class="bg-gray-800/60 p-3.5 rounded-xl border border-gray-700/50 flex items-center gap-3 hover:border-blue-500/30 transition-colors">
                        <div class="w-10 h-10 rounded-lg bg-blue-900/30 text-blue-400 flex items-center justify-center border border-blue-500/20"><i class="fas fa-id-badge"></i></div>
                        <div class="overflow-hidden">
                            <p class="text-[9px] text-gray-400 uppercase tracking-widest font-bold mb-0.5">User UID</p>
                            <p id="user-detail-uid" class="text-sm font-mono text-gray-200 truncate" title=""></p>
                        </div>
                    </div>
                    <!-- Join Date Box -->
                    <div class="bg-gray-800/60 p-3.5 rounded-xl border border-gray-700/50 flex items-center gap-3 hover:border-emerald-500/30 transition-colors">
                        <div class="w-10 h-10 rounded-lg bg-emerald-900/30 text-emerald-400 flex items-center justify-center border border-emerald-500/20"><i class="fas fa-calendar-check"></i></div>
                        <div class="overflow-hidden">
                            <p class="text-[9px] text-gray-400 uppercase tracking-widest font-bold mb-0.5">Join Date</p>
                            <p id="user-detail-join" class="text-sm text-gray-200 font-medium truncate"></p>
                        </div>
                    </div>
                    <!-- Last Active Box (Spans Full Width) -->
                    <div class="bg-gray-800/60 p-3.5 rounded-xl border border-gray-700/50 sm:col-span-2 flex items-center gap-3 hover:border-amber-500/30 transition-colors">
                        <div class="w-10 h-10 rounded-lg bg-amber-900/30 text-amber-400 flex items-center justify-center border border-amber-500/20"><i class="fas fa-history"></i></div>
                        <div class="overflow-hidden">
                            <p class="text-[9px] text-gray-400 uppercase tracking-widest font-bold mb-0.5">Last Active / Live</p>
                            <p id="user-detail-lastseen" class="text-sm text-gray-200 font-medium truncate"></p>
                        </div>
                    </div>
                </div>

                <!-- Premium Action Buttons -->
                <div class="flex flex-col sm:flex-row gap-3 pt-2">
                    <button id="user-toggle-freeze" class="flex-1 bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 text-white py-3.5 rounded-xl text-sm font-bold shadow-lg transition-all transform hover:-translate-y-0.5 active:scale-95 flex items-center justify-center gap-2">
                        <i id="freeze-icon" class="fas fa-snowflake"></i> <span id="freeze-btn-text">Freeze User</span>
                    </button>
                    <button id="user-toggle-delete" class="flex-1 bg-gray-800 hover:bg-red-600 border border-gray-600 hover:border-red-500 text-gray-300 hover:text-white py-3.5 rounded-xl text-sm font-bold shadow-lg transition-all transform hover:-translate-y-0.5 active:scale-95 flex items-center justify-center gap-2">
                        <i id="delete-icon" class="fas fa-user-slash text-red-400"></i> <span id="delete-btn-text">Delete User</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
