        <div class="p-6 text-center">
            <div id="custom-modal-icon" class="w-16 h-16 rounded-full mx-auto flex items-center justify-center mb-4 border shadow-inner">

            </div>
            <h3 id="custom-modal-title" class="text-xl font-bold text-white mb-2">Notice</h3>
            <p id="custom-modal-message" class="text-sm text-gray-300 mb-6 leading-relaxed">Message goes here</p>

                <!-- Buttons injected by JS -->
            </div>
        </div>
    </div>
</div>
