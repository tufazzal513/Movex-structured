<!-- SMART AD MODAL -->
<div id="ad-modal" class="hidden">
    <div class="text-center p-6 bg-slate-800 rounded-xl border border-slate-700 shadow-2xl max-w-sm w-full mx-4 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 to-purple-500"></div>
        <h3 class="text-xl font-bold mb-2 text-white">Sponsored Message</h3>
        <p class="text-sm text-gray-400 mb-4" id="smart-ad-msg">Please watch a quick ad to support our platform.</p>

        <p id="smart-ad-status" class="text-xs text-yellow-400 font-bold mb-4 hidden">Ready</p>

        <button id="watch-ad-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg ad-btn-pulse transition-all transform hover:-translate-y-1 mb-2">
            <i class="fas fa-play-circle mr-2"></i> Watch Ad
        </button>
        <button id="smart-ad-try-btn" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-all hidden">
            Try Again
        </button>
    </div>
</div>
