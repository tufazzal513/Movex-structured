<!-- AUTH SCREEN -->
<div id="auth-screen">
    <div class="movex-bg"></div>
    <div class="movex-overlay"></div>

    <div class="auth-card animate-fade-in-up">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-white mb-2 dynamic-app-name"></h1>
            <p class="text-gray-400 text-sm">Your Unlimited Movie Destination</p>
        </div>
        <!-- Login Form -->
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1 ml-1">Email Address</label>
                <input type="email" id="login-email" placeholder="name@example.com" class="w-full bg-slate-800/50 border border-slate-600 rounded-lg py-3 px-3 text-sm text-white focus:outline-none focus:border-blue-500" required>
            </div>
            <div>
                <div class="flex justify-between items-center mb-1 ml-1 pr-1">
                    <label class="block text-xs font-medium text-gray-400">Password</label>
                    <button type="button" onclick="toggleAuthMode('forgot')" class="text-[11px] text-blue-400 hover:text-blue-300 font-medium transition-colors">Forgot Password?</button>
                </div>
                <div class="relative">
                    <input type="password" id="login-password" placeholder="••••••••" class="w-full bg-slate-800/50 border border-slate-600 rounded-lg py-3 pl-3 pr-10 text-sm text-white focus:outline-none focus:border-blue-500" required>
                    <button type="button" onclick="togglePasswordVisibility('login-password', this)" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-white transition-colors focus:outline-none">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg shadow-lg transition-all transform active:scale-95">Log In</button>
        </form>

        <!-- Forgot Password Form -->
        <form id="forgot-form" class="space-y-4 hidden">
            <div class="mb-2 text-center">
                <h3 class="text-lg font-bold text-white mb-1">Reset Password</h3>
                <p class="text-xs text-gray-400">Enter your registered email below</p>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1 ml-1">Email Address</label>
                <input type="email" id="forgot-email" placeholder="name@example.com" class="w-full bg-slate-800/50 border border-slate-600 rounded-lg py-3 px-3 text-sm text-white focus:outline-none focus:border-blue-500" required>
            </div>
            <button type="submit" id="forgot-submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-lg shadow-lg transition-all transform active:scale-95 flex items-center justify-center gap-2">
                <i class="fas fa-paper-plane"></i> Send Reset Link
            </button>
            <button type="button" onclick="toggleAuthMode('login')" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-medium py-2 rounded-lg transition-all text-sm">
                <i class="fas fa-arrow-left mr-1"></i> Back to Login
            </button>
        </form>

        <!-- Signup Form -->
        <form id="signup-form" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1 ml-1">Full Name</label>
                <input type="text" id="signup-name" placeholder="John Doe" class="w-full bg-slate-800/50 border border-slate-600 rounded-lg py-3 px-3 text-sm text-white focus:outline-none focus:border-blue-500" required>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1 ml-1">Email Address</label>
                <input type="email" id="signup-email" placeholder="name@example.com" class="w-full bg-slate-800/50 border border-slate-600 rounded-lg py-3 px-3 text-sm text-white focus:outline-none focus:border-blue-500" required>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1 ml-1">Password</label>
                <div class="relative">
                    <input type="password" id="signup-password" placeholder="Min. 6 characters" class="w-full bg-slate-800/50 border border-slate-600 rounded-lg py-3 pl-3 pr-10 text-sm text-white focus:outline-none focus:border-blue-500" required>
                    <button type="button" onclick="togglePasswordVisibility('signup-password', this)" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-white transition-colors focus:outline-none">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold py-3 rounded-lg shadow-lg transition-all transform active:scale-95">Create Account</button>
        </form>
        <div id="auth-extra-elements">

            <div class="text-center mt-6">
                <p id="toggle-text-login" class="text-sm text-gray-400">
                    Don't have an account? <button onclick="toggleAuthMode('signup')" class="text-blue-400 hover:text-blue-300 font-semibold ml-1">Sign Up</button>
                </p>
                <p id="toggle-text-signup" class="text-sm text-gray-400 hidden">
                    Already have an account? <button onclick="toggleAuthMode('login')" class="text-blue-400 hover:text-blue-300 font-semibold ml-1">Log In</button>
                </p>
            </div>
        </div>
        <p id="auth-error" class="text-red-400 text-xs text-center mt-4 min-h-[20px]"></p>
    </div>
</div>
