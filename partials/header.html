<!-- Global Top App Bar (Locked & Thin) -->
<header id="global-header" class="fixed top-0 left-0 right-0 max-w-4xl mx-auto h-12 bg-slate-900/90 backdrop-blur-md border-b border-slate-700 shadow-sm z-50 flex justify-between items-center px-4 transition-all duration-300" style="display: none;">
    <div class="flex items-center gap-2.5 logo-anim flex-shrink-0">
        <img id="header-logo-img" src="" alt="Logo" class="w-7 h-7 rounded-md object-cover hidden border border-slate-600 shadow-[0_0_10px_var(--accent)]">
        <h1 class="text-lg font-bold text-white dynamic-app-name mb-0"></h1>
    </div>

    <!-- Removed the ad slot & Added user profile shortcut -->
    <div class="flex items-center gap-3">
        <span id="header-user-name" class="text-xs text-blue-300 font-medium hidden md:inline"></span>
        <button onclick="showPage('profile-page')" class="w-7 h-7 rounded-full bg-slate-800 border border-slate-600 flex items-center justify-center text-gray-300 hover:text-white hover:bg-slate-700 transition-colors shadow-sm">
            <i class="fas fa-user text-[10px]"></i>
        </button>
    </div>
</header>
