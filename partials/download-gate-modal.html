<!-- DOWNLOAD GATE MODAL -->
<div id="dl-gate-modal" style="display:none;" class="fixed inset-0 z-[9998] bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden">
        <div class="p-5 border-b border-slate-700">
            <div class="flex items-center justify-between">
                <h3 class="text-lg font-bold">Download Unlock</h3>
                <button id="dl-gate-close" class="text-gray-400 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            <p id="dl-gate-sub" class="text-xs text-gray-400 mt-1">Watch ads to unlock download</p>
        </div>

        <div class="p-5 space-y-4">
            <div class="flex items-center justify-between bg-slate-800/60 border border-slate-700 rounded-xl p-3">
                <div>
                    <p class="text-xs text-gray-400">Progress</p>
                    <p class="text-base font-bold"><span id="dl-gate-progress">0</span>/<span id="dl-gate-limit">0</span> ads</p>
                </div>
                <div class="text-right">
                    <p class="text-xs text-gray-400">Required</p>
                    <p class="text-base font-bold"><span id="dl-gate-seconds">0</span>s each</p>
                </div>
            </div>

            <div class="bg-slate-800/40 border border-slate-700 rounded-xl p-3">
                <p class="text-xs text-gray-400 mb-2">Status</p>
                <p id="dl-gate-status" class="text-sm text-gray-200">Ready</p>
                <p id="dl-gate-hint" class="text-[11px] text-gray-500 mt-1">If you return early, it won’t count.</p>
            </div>

            <button id="dl-gate-watch" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition-all">
                <i class="fas fa-play-circle mr-2"></i> Watch Ad
            </button>
            <button id="dl-gate-try" style="display:none;" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl transition-all">
                Try Again
            </button>

            <p id="dl-gate-popup" class="text-[11px] text-red-400 hidden">Popup blocked. Please allow popups and try again.</p>
        </div>
    </div>
</div>
